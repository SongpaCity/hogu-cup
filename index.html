<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>호구컵</title>
  <meta property="og:title" content="호구컵" />
  <meta property="og:description" content="제2회 호구컵 — THE ROAD TO THE THRONE" />
  <meta property="og:image" content="poster.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
  <style>
    /* ===== 루디브리엄(장난감 마을·블록) 테마 ===== */
    :root {
      --sky1:#aee4ff; --sky2:#cfe0ff; --sky3:#e9d7ff;
      --card:#fffdf7; --ink:#4a3f2e; --muted:#9a8c74; --line:#efe3c9;
      --gold:#f4b82e; --gold2:#d2941a;
      --toy-red:#ff6b6b; --toy-blue:#4aa7ff; --toy-green:#5ed07a; --toy-yellow:#ffd23f; --toy-purple:#b07bff;
      --block-shadow: 0 6px 0; /* 블록 3D 하단 그림자 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); overflow: hidden;
      font-family: "Jua", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-text-size-adjust: 100%;
      background: linear-gradient(180deg, var(--sky1), var(--sky3));
    }
    /* 고정 배경(스크롤 영향 없음) */
    .bg-fixed { position: fixed; inset: 0; z-index: -1;
      background: url('assets/bg-maple.png') center center / cover no-repeat; }
    .bg-fixed::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,.18) 35%, rgba(233,215,255,.4)); }

    /* 가로 3화면 캐러셀 */
    .screens { display: flex; width: 100vw; height: 100vh; height: 100dvh;
      overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .screens::-webkit-scrollbar { display: none; }
    .screens { scrollbar-width: none; }
    .screen { flex: 0 0 100vw; width: 100vw; height: 100%; scroll-snap-align: center;
      overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .screen::-webkit-scrollbar { width: 0; }
    .screen-inner { max-width: 620px; margin: 0 auto; padding: 10px 16px 40px; min-height: 100%; }
    .screen-inner.s1 { display: flex; flex-direction: column; min-height: 100dvh; padding-bottom: 20px; }

    /* 좌우 방향키 */
    .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 20;
      width: 44px; height: 64px; border: 0; cursor: pointer; font-size: 2rem; line-height: 1;
      color: #fff; font-family: "Jua", sans-serif; border-radius: 16px;
      background: linear-gradient(180deg, rgba(103,182,255,.92), rgba(74,167,255,.92));
      box-shadow: 0 5px 0 rgba(45,120,196,.9), inset 0 2px 2px rgba(255,255,255,.5);
      transition: opacity .2s ease, transform .1s ease; }
    .nav:active { transform: translateY(-50%) scale(.94); }
    .nav.prev { left: 8px; } .nav.next { right: 8px; }
    .nav[disabled] { opacity: 0; pointer-events: none; }
    .dots { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 20;
      display: flex; gap: 8px; }
    .dots .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.65);
      box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: all .2s ease; cursor: pointer; }
    .dots .dot.on { background: var(--gold); width: 22px; border-radius: 6px; }

    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 0 0; }
    .mode { font-size: .72rem; color: #6b5e45; background: #fff; border: 2px solid #fff; border-radius: 999px; padding: 4px 11px; box-shadow: 0 3px 0 rgba(120,100,60,.25); }
    .mode.live { color: #2a8a4a; }
    .adminbtn, #bgmBtn {
      font-family: "Jua", sans-serif; font-size: .8rem; color: #fff;
      border: 0; border-radius: 12px; padding: 7px 13px; cursor: pointer;
      background: linear-gradient(180deg, #67b6ff, var(--toy-blue));
      box-shadow: 0 4px 0 #2d78c4, inset 0 2px 2px rgba(255,255,255,.5);
      text-shadow: 0 1px 1px rgba(0,0,0,.18);
    }
    .adminbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2d78c4, inset 0 2px 2px rgba(255,255,255,.5); }

    /* 주크박스 */
    .jukebox { display: flex; align-items: center; gap: 7px; margin: 10px 0 0; padding: 8px 10px;
      background: rgba(255,255,255,.82); border: 3px solid #fff; border-radius: 16px;
      box-shadow: 0 5px 0 rgba(120,100,60,.2); backdrop-filter: blur(2px); }
    .jbctl { flex: 0 0 auto; width: 38px; height: 38px; border: 0; border-radius: 11px; cursor: pointer;
      font-size: 1rem; color: #fff; font-family: "Jua", sans-serif;
      background: linear-gradient(180deg, #67b6ff, var(--toy-blue));
      box-shadow: 0 4px 0 #2d78c4, inset 0 2px 2px rgba(255,255,255,.5);
      transition: transform .09s ease, box-shadow .12s ease, filter .15s ease; }
    .jbctl:hover { filter: brightness(1.08); }
    .jbctl:active { transform: translateY(3px); box-shadow: 0 1px 0 #2d78c4, inset 0 2px 2px rgba(255,255,255,.5); }
    .jbctl.play { background: linear-gradient(180deg, #8ee6a4, var(--toy-green)); box-shadow: 0 4px 0 #2f9c52, inset 0 2px 2px rgba(255,255,255,.5); }
    .jbctl.play:active { box-shadow: 0 1px 0 #2f9c52, inset 0 2px 2px rgba(255,255,255,.5); }
    .jbinfo { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .jbnote { flex: 0 0 auto; }
    .jbtitle { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--ink); font-size: .92rem; font-family: "Gaegu", sans-serif; }
    .jukebox.playing .jbnote { animation: notepulse 1s ease-in-out infinite; }
    @keyframes notepulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .7; } }
    #aTlist .line span { flex: 1; font-size: .86rem; }

    /* 대문 포스터 — 나무 액자 블록 */
    .hero { margin: 14px 0 0; }
    .hero img { width: 100%; height: auto; display: block; border-radius: 20px; border: 6px solid #fff; box-shadow: 0 10px 0 rgba(120,100,60,.22), 0 16px 34px rgba(80,70,120,.28); }

    /* 카운트다운 — 장난감 블록 시계탑 */
    .countdown { margin: 24px 0 0; background: var(--card); border: 4px solid #fff; border-radius: 22px; padding: 20px 18px; text-align: center; box-shadow: var(--block-shadow) rgba(120,100,60,.22); }
    .countdown .label { color: var(--gold2); font-size: 1.12rem; letter-spacing: .01em; }
    .countdown .date { color: var(--muted); font-size: .9rem; margin-top: 4px; font-family: "Gaegu", sans-serif; }
    .clock { margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .unit { color: #fff; border-radius: 14px; padding: 12px 14px; min-width: 76px; box-shadow: inset 0 3px 4px rgba(255,255,255,.4), 0 5px 0 rgba(0,0,0,.14); }
    .unit:nth-child(1){ background: linear-gradient(180deg,#ff9a9a,var(--toy-red)); }
    .unit:nth-child(2){ background: linear-gradient(180deg,#8fc6ff,var(--toy-blue)); }
    .unit:nth-child(3){ background: linear-gradient(180deg,#8ee6a4,var(--toy-green)); }
    .unit:nth-child(4){ background: linear-gradient(180deg,#c9a6ff,var(--toy-purple)); }
    .unit .num { font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1.1; text-shadow: 0 2px 2px rgba(0,0,0,.2); }
    .unit .cap { font-size: .66rem; margin-top: 2px; letter-spacing: .1em; opacity: .92; font-family: "Gaegu", sans-serif; }

    h2.sec {
      font-size: 1.3rem; margin: 34px 0 14px; color: var(--ink);
      display: inline-block; padding: 6px 16px; background: #fff; border-radius: 14px 14px 14px 4px;
      box-shadow: 0 4px 0 rgba(120,100,60,.2); border: 2px solid #fff;
    }

    /* 디펜딩 챔피언 (지난 대회 우승자) — 메이플 팝업 패널 + 금장 */
    #defenderBox { max-width: 400px; margin: 10px auto 18px; }
    #defenderBox .champcard {
      position: relative; text-align: center; padding: 30px 22px 20px;
      background: url('assets/panel-base.png') no-repeat center / 100% 100%;
      border: 3px solid var(--gold); border-radius: 22px;
      box-shadow: 0 10px 26px rgba(70,70,120,.3), 0 0 0 4px rgba(255,255,255,.55) inset, 0 0 22px rgba(244,184,46,.4);
    }
    #defenderBox .crown { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 2.6rem; filter: drop-shadow(0 3px 4px rgba(120,80,0,.45)); animation: bob 2.4s ease-in-out infinite; }
    #defenderBox .clabel { color: #fff; font-size: .9rem; letter-spacing: .03em; text-shadow: 0 1px 3px rgba(20,40,80,.6); }
    #defenderBox .cname { font-size: clamp(1.6rem, 8vw, 2.4rem); color: #fff; line-height: 1.1; margin-top: 4px;
      text-shadow: 0 2px 4px rgba(20,40,80,.65), 0 0 14px rgba(255,235,160,.7); }
    #defenderBox .champcard.tbd .cname { opacity: .9; }
    #defenderBox .cdisc { font-size: .9rem; color: #fff3d6; margin-top: 4px; font-family: "Gaegu", sans-serif; text-shadow: 0 1px 2px rgba(20,40,80,.6); }
    #defenderBox .podium { display: flex; gap: 14px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    #defenderBox .podium .p { font-size: .92rem; color: var(--ink); background: rgba(255,255,255,.92); border-radius: 12px; padding: 6px 12px; box-shadow: 0 3px 0 rgba(120,100,60,.18); }
    #defenderBox .podium .p b { color: var(--gold2); }
    @keyframes bob { 0%,100%{ transform: translateX(-50%) translateY(0); } 50%{ transform: translateX(-50%) translateY(-6px); } }

    /* 지난 대회 수상자 시상대(2-1-3) */
    #defenderBox .dlabel { text-align: center; color: var(--gold2); font-size: 1.05rem; margin-bottom: 10px;
      background: rgba(255,255,255,.85); border-radius: 14px; padding: 6px 14px; display: table; margin-left: auto; margin-right: auto;
      box-shadow: 0 3px 0 rgba(120,100,60,.18); }
    .wpodium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
    .wp { flex: 1 1 0; max-width: 128px; display: flex; flex-direction: column; align-items: center; }
    .wp.empty { visibility: hidden; }
    .wp .wcrown { font-size: 1.7rem; margin-bottom: 2px; filter: drop-shadow(0 2px 3px rgba(120,80,0,.4)); animation: wbob 2.4s ease-in-out infinite; }
    .wp .avatar { width: 68px; height: 68px; border-radius: 50%; object-fit: cover; background: #fff;
      border: 3px solid #fff; box-shadow: 0 4px 10px rgba(70,70,120,.3); }
    .wp.r1 .avatar { width: 96px; height: 96px; border-color: var(--gold); box-shadow: 0 5px 12px rgba(170,120,20,.4), 0 0 16px rgba(244,184,46,.5); }
    .wp .wname { margin-top: 6px; font-size: .98rem; color: var(--ink); text-align: center; line-height: 1.1;
      text-shadow: 0 1px 2px rgba(255,255,255,.7); }
    .wp.r1 .wname { font-size: 1.12rem; color: var(--gold2); }
    .wp .wdisc { font-size: .72rem; color: var(--muted); font-family: "Gaegu", sans-serif; margin-top: 1px; }
    .wp .ped { width: 100%; margin-top: 8px; border-radius: 12px 12px 8px 8px; display: grid; place-items: center;
      background: linear-gradient(180deg, #ffffff, #eef0f6); border: 3px solid #fff;
      box-shadow: inset 0 3px 4px rgba(255,255,255,.8), 0 6px 0 rgba(120,110,90,.28); }
    .wp.r1 .ped { height: 78px; } .wp.r2 .ped { height: 56px; } .wp.r3 .ped { height: 44px; }
    .wp .rnum { font-size: 2.3rem; line-height: 1; font-family: "Jua", sans-serif; -webkit-background-clip: text; background-clip: text; color: transparent; }
    .wp .rnum.ng { background-image: linear-gradient(180deg,#fff3b0 10%,#f4c430 45%,#b5841d 90%); }
    .wp .rnum.ns { background-image: linear-gradient(180deg,#ffffff 10%,#cfd6df 45%,#8a94a4 90%); }
    .wp .rnum.nb { background-image: linear-gradient(180deg,#ffd9a8 10%,#cd7f32 45%,#7d4f23 90%); }
    @keyframes wbob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-5px); } }
    /* 관리자 참가자 목록 미니 프로필 */
    #aPlist .mini { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); background:#fff; }

    /* 스코어보드 — 블록 카드 */
    .score { background: var(--card); border: 4px solid #fff; border-radius: 18px; overflow: hidden; box-shadow: var(--block-shadow) rgba(120,100,60,.22); }
    .score .row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-bottom: 2px dashed var(--line); }
    .score .row:last-child { border-bottom: 0; }
    .score .rk { width: 28px; text-align: center; color: var(--muted); }
    .score .nm { flex: 1; font-size: 1.05rem; }
    .score .nm small { color: var(--muted); margin-left: 6px; font-family: "Gaegu", sans-serif; }
    .score .pt { font-size: 1.45rem; font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; color: var(--gold2); }
    .score .ctl { display: flex; gap: 6px; margin-left: 10px; }
    .score .ctl button { width: 34px; height: 34px; border-radius: 10px; border: 0; color: #fff; cursor: pointer; font-family: "Jua",sans-serif; box-shadow: inset 0 2px 2px rgba(255,255,255,.4), 0 3px 0 rgba(0,0,0,.18); }
    .score .ctl button[data-up]{ background: var(--toy-green); }
    .score .ctl button[data-dn]{ background: var(--toy-red); }
    .score .ctl button:active { transform: translateY(2px); }

    /* 금·은·동 메달 배지 */
    .score .medal { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; display: grid; place-items: center; font-size: .95rem; color:#fff; box-shadow: inset 0 2px 3px rgba(255,255,255,.6), 0 2px 3px rgba(0,0,0,.25); }
    .score .medal.g { background: radial-gradient(circle at 35% 28%, #fff6c0, #f4c430 52%, #a9781a); color: #6a4700; }
    .score .medal.s { background: radial-gradient(circle at 35% 28%, #ffffff, #d4dae3 52%, #8893a5); color: #3a4452; }
    .score .medal.b { background: radial-gradient(circle at 35% 28%, #ffdcad, #cd7f32 52%, #7d4f23); color: #4a2e0c; }
    /* 전대회 우승자(디펜딩 챔피언) 금장 슬롯 */
    .score .row.champ { background: linear-gradient(90deg, rgba(244,184,46,.28), rgba(244,184,46,.06)); box-shadow: inset 5px 0 0 var(--gold); }
    .score .row .crown { filter: drop-shadow(0 0 4px rgba(244,184,46,.75)); margin-left: 2px; }

    /* 참가자 — 블록 명패 */
    .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; }
    .player { background: var(--card); border: 3px solid #fff; border-radius: 16px; padding: 13px; display: flex; align-items: center; gap: 12px; box-shadow: 0 5px 0 rgba(120,100,60,.18); }
    .player .no { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-size: 1.05rem; box-shadow: inset 0 2px 2px rgba(255,255,255,.45), 0 3px 0 rgba(0,0,0,.14); }
    .player:nth-child(6n+1) .no{ background: var(--toy-red); }
    .player:nth-child(6n+2) .no{ background: var(--toy-blue); }
    .player:nth-child(6n+3) .no{ background: var(--toy-green); }
    .player:nth-child(6n+4) .no{ background: var(--toy-purple); }
    .player:nth-child(6n+5) .no{ background: var(--gold); }
    .player:nth-child(6n+6) .no{ background: #ff9f43; }
    .player .nm { font-size: 1.05rem; }

    /* 회차별 우승자 */
    .champs { width: 100%; border-collapse: collapse; background: var(--card); border: 4px solid #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--block-shadow) rgba(120,100,60,.2); }
    .champs th, .champs td { padding: 12px 13px; text-align: left; border-bottom: 2px dashed var(--line); font-size: .98rem; }
    .champs th { color: #fff; background: var(--toy-purple); font-size: .82rem; }
    .champs tr:last-child td { border-bottom: 0; }
    .champs .trophy { color: var(--gold2); }
    .empty { color: var(--muted); font-size: .95rem; text-align: center; padding: 22px; background: var(--card); border: 3px dashed var(--line); border-radius: 16px; font-family: "Gaegu", sans-serif; }

    /* 관리자 패널 — 장난감 공구함 */
    #admin { display: none; margin: 14px 0 0; background: #fff; border: 4px dashed var(--toy-yellow); border-radius: 18px; padding: 16px; box-shadow: 0 6px 0 rgba(120,100,60,.18); }
    #admin.on { display: block; }
    #admin h3 { margin: 0 0 10px; font-size: 1.05rem; color: var(--toy-purple); }
    #admin .grp { margin: 0 0 14px; }
    #admin label { display: block; font-size: .85rem; color: #7a6d55; margin: 0 0 5px; }
    #admin input, #admin button.act { font: inherit; }
    #admin input { background: #fffef9; color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: .95rem; font-family: "Gaegu", sans-serif; }
    #admin button.act { color: #fff; border: 0; border-radius: 12px; padding: 8px 15px; cursor: pointer; font-family: "Jua",sans-serif;
      background: linear-gradient(180deg,#ffdf6b,var(--gold)); box-shadow: 0 4px 0 var(--gold2), inset 0 2px 2px rgba(255,255,255,.5); text-shadow: 0 1px 1px rgba(0,0,0,.12); }
    #admin button.act:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold2), inset 0 2px 2px rgba(255,255,255,.5); }
    #admin button.rm { background: #fff; border: 2px solid var(--toy-red); color: var(--toy-red); border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: .85rem; font-family: "Jua",sans-serif; }
    #admin .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
    #admin .hint { color: var(--muted); font-size: .85rem; line-height: 1.5; font-family: "Gaegu", sans-serif; }

    .foot { color: #5a4f7a; font-size: .85rem; text-align: center; margin-top: 36px; font-family: "Gaegu", sans-serif; text-shadow: 0 1px 2px rgba(255,255,255,.5); }

    /* ================= 연출(트랜지션·애니메이션) ================= */
    html { -webkit-tap-highlight-color: transparent; }
    img { max-width: 100%; }
    .adminbtn, #bgmBtn, #admin button.act, #admin button.rm, .score .ctl button { transition: transform .09s ease, box-shadow .12s ease, filter .15s ease; }
    .adminbtn:hover, #bgmBtn:hover, #admin button.act:hover, .score .ctl button:hover { filter: brightness(1.08); }
    .hero { animation: floaty 5.5s ease-in-out infinite; }
    .hero img { transition: transform .3s ease, box-shadow .3s ease; }
    .hero img:hover { transform: scale(1.015); }
    .player { transition: transform .18s ease, box-shadow .18s ease; }
    .player:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(120,100,60,.2); }
    .score .row { transition: background .2s ease; }
    .score .row:hover { background: rgba(244,184,46,.07); }
    .champs tr { transition: background .2s ease; }
    .champs tbody tr:hover { background: rgba(176,123,255,.08); }
    /* 초 단위 맥박 */
    #ss { display: inline-block; animation: secpulse 1s ease-out infinite; }
    /* 점수 변동 팝 */
    .score .pt.pop { animation: ptpop .55s cubic-bezier(.22,1,.36,1); }
    /* 등장 리빌(로드 시 1회) */
    .hero, .countdown, h2.sec, #defenderBox, .score, .players, #champsBox {
      animation: revealUp .6s cubic-bezier(.22,1,.36,1) both;
    }
    .hero { animation: revealUp .6s cubic-bezier(.22,1,.36,1) both, floaty 5.5s ease-in-out 1s infinite; }
    .countdown { animation-delay: .06s; }
    #defenderBox { animation-delay: .12s; }
    .score { animation-delay: .18s; }
    .players { animation-delay: .24s; }
    #champsBox { animation-delay: .3s; }
    @keyframes revealUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes secpulse { 0% { transform: scale(1.14); } 60%,100% { transform: scale(1); } }
    @keyframes ptpop { 0% { transform: scale(1); } 30% { transform: scale(1.55); color: var(--toy-green); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .hero, .countdown, h2.sec, #defenderBox, .score, .players, #champsBox, #ss, #defenderBox .crown { animation: none !important; }
    }

    /* 화면1: 로고(포스터) 축소 — 세로 화면에 topbar·주크박스·타이머까지 수용 */
    .screen-inner.s1 .hero { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; margin: 12px 0; }
    .screen-inner.s1 .hero img { width: auto; max-width: 100%; max-height: 50vh; max-height: 50dvh; object-fit: contain; }
    .screen-inner.s1 .countdown { flex: 0 0 auto; margin: 0; }
    .screen-inner.s1 .jukebox { flex: 0 0 auto; }

    /* 명단 모드(대회 전): 순위·점수 없이 이름만, 직전 우승자 맨 위 왕관 */
    .score .row.name-only { gap: 10px; }
    .score .row.name-only .nm { font-size: 1.08rem; }
    .score .row.name-only .crown { filter: drop-shadow(0 0 4px rgba(244,184,46,.8)); }

    /* 좌우 방향키와 콘텐츠가 겹치지 않도록 여백 확보 */
    @media (max-width: 760px) { .screen-inner { padding-left: 52px; padding-right: 52px; } }

    /* 방명록(댓글) */
    .cmt-form { display: flex; flex-wrap: wrap; gap: 8px; background: var(--card); border: 3px solid #fff; border-radius: 16px; padding: 12px; box-shadow: 0 5px 0 rgba(120,100,60,.18); margin-bottom: 14px; }
    .cmt-form input { flex: 0 0 110px; }
    .cmt-form input, .cmt-form textarea { background: #fffef9; color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font-family: "Gaegu", sans-serif; font-size: .95rem; }
    .cmt-form textarea { flex: 1 1 100%; resize: vertical; min-height: 44px; }
    .cmt-form button.act { flex: 0 0 auto; margin-left: auto; color:#fff; border:0; border-radius:12px; padding:8px 16px; cursor:pointer; font-family:"Jua",sans-serif;
      background: linear-gradient(180deg,#8ee6a4,var(--toy-green)); box-shadow:0 4px 0 #2f9c52, inset 0 2px 2px rgba(255,255,255,.5); transition: transform .09s ease; }
    .cmt-form button.act:active { transform: translateY(3px); box-shadow:0 1px 0 #2f9c52, inset 0 2px 2px rgba(255,255,255,.5); }
    .cmt { background: var(--card); border: 3px solid #fff; border-radius: 14px; padding: 11px 13px; margin-bottom: 9px; box-shadow: 0 4px 0 rgba(120,100,60,.14); animation: revealUp .4s ease both; }
    .cmt .top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .cmt .who { color: var(--gold2); font-size: .98rem; }
    .cmt .when { color: var(--muted); font-size: .72rem; font-family: "Gaegu", sans-serif; margin-left: auto; }
    .cmt .body { color: var(--ink); font-size: .98rem; font-family: "Gaegu", sans-serif; white-space: pre-wrap; word-break: break-word; }
    .cmt .del { background:#fff; border:2px solid var(--toy-red); color:var(--toy-red); border-radius:8px; padding:2px 8px; font-size:.75rem; cursor:pointer; font-family:"Jua",sans-serif; }
    .cmt-empty { color: var(--muted); text-align:center; padding: 20px; font-family:"Gaegu",sans-serif; background: rgba(255,255,255,.75); border-radius: 14px; }
    .cmt-pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0 4px; }
    .cmt-pager .pgbtn { width: 38px; height: 34px; border: 0; border-radius: 10px; cursor: pointer; color: #fff; font-family: "Jua",sans-serif;
      background: linear-gradient(180deg,#67b6ff,var(--toy-blue)); box-shadow: 0 4px 0 #2d78c4, inset 0 2px 2px rgba(255,255,255,.5); transition: transform .09s ease; }
    .cmt-pager .pgbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2d78c4, inset 0 2px 2px rgba(255,255,255,.5); }
    .cmt-pager .pgbtn[disabled] { opacity: .35; pointer-events: none; }
    .cmt-pager .pginfo { color: var(--ink); font-size: .95rem; background: rgba(255,255,255,.85); border-radius: 10px; padding: 4px 12px; box-shadow: 0 2px 0 rgba(120,100,60,.15); }

    /* ================= 모바일 반응형 ================= */
    @media (max-width: 560px) {
      .wrap { padding: 0 12px 48px; }
      .topbar { gap: 6px; }
      h2.sec { font-size: 1.12rem; padding: 5px 13px; margin: 28px 0 12px; }
      .countdown { padding: 16px 12px; }
      .countdown .label { font-size: 1rem; }
      .clock { gap: 8px; }
      .unit { min-width: 64px; padding: 10px 10px; }
      .unit .num { font-size: 1.6rem; }
      .score .row { padding: 11px 12px; gap: 9px; }
      .score .nm { font-size: .98rem; }
      .score .pt { font-size: 1.25rem; }
      .score .ctl button { width: 32px; height: 32px; }
      .players { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 9px; }
      #defenderBox { max-width: 340px; }
      #admin input { font-size: .92rem; }
      #admin .line { gap: 5px; }
    }
    @media (max-width: 380px) {
      .clock { gap: 6px; }
      .unit { min-width: 56px; padding: 9px 7px; }
      .unit .num { font-size: 1.4rem; }
      .players { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="bg-fixed"></div>

  <div class="screens" id="screens">

    <!-- ===== 1화면: 관리자·주크박스·로고·남은 시간 ===== -->
    <section class="screen"><div class="screen-inner s1">
    <div class="topbar">
      <span class="mode" id="mode">로컬 모드</span>
      <button class="adminbtn" id="adminToggle">관리자</button>
    </div>

    <!-- 주크박스 -->
    <div class="jukebox" id="jukebox">
      <button class="jbctl" id="jbPrev" title="이전 곡">⏮</button>
      <button class="jbctl play" id="jbPlay" title="재생/정지">▶</button>
      <button class="jbctl" id="jbNext" title="다음 곡">⏭</button>
      <div class="jbinfo"><span class="jbnote">🎵</span><span class="jbtitle" id="jbTitle">—</span></div>
      <button class="jbctl" id="bgmBtn" title="음소거">🔊</button>
    </div>
    <audio id="bgm" preload="auto" playsinline></audio>

    <!-- 관리자 패널 -->
    <div id="admin">
      <h3>🔧 관리자 패널 <span style="color:var(--muted);font-weight:400;font-size:.8rem">(변경 즉시 전원에게 반영)</span></h3>
      <div class="grp">
        <label>호구컵 날짜 (비우면 '미정')</label>
        <div class="line"><input type="datetime-local" id="aDate"><button class="act" id="aDateSave">저장</button></div>
      </div>
      <div class="grp">
        <label>로비 대문 이미지 (업로드 시 전원 공유 · 자동 축소 저장)</label>
        <div class="line"><input type="file" id="aPoster" accept="image/*"><button class="act" id="aPosterReset">기본값</button></div>
        <p class="hint">큰 이미지는 자동으로 줄여 저장합니다(가로 최대 1100px).</p>
      </div>
      <div class="grp">
        <label>🎵 주크박스 재생목록 (관리자 설정)</label>
        <div class="line"><input id="aTtitle" placeholder="곡 제목" style="width:110px"><input id="aTurl" placeholder="오디오 URL (mp3 등)" style="flex:1;min-width:130px"><button class="act" id="aTadd">URL 추가</button></div>
        <div class="line"><input type="file" id="aTfile" accept="audio/*"><button class="act" id="aTupload">파일 추가</button></div>
        <p class="hint">URL/작은 파일(≤700KB)은 전원 공유, 큰 파일은 이 기기에서만 임시 재생됩니다.</p>
        <div id="aTlist"></div>
      </div>
      <div class="grp">
        <label>참가자 추가 (사진 선택 — 없으면 기본 이미지)</label>
        <div class="line"><input id="aPname" placeholder="이름" style="width:110px"><input id="aPno" placeholder="번호" style="width:64px" inputmode="numeric"><input type="file" id="aPphoto" accept="image/*" style="max-width:170px"><button class="act" id="aPadd">추가</button></div>
        <input type="file" id="aPphotoSwap" accept="image/*" style="display:none">
        <div id="aPlist"></div>
        <p class="hint">목록의 📷 버튼으로 기존 참가자 사진을 바꿀 수 있습니다.</p>
      </div>
      <div class="grp">
        <label>지난 대회 순위 추가 (1·2·3등 입력 — 1등은 금장 프레임에 표시)</label>
        <div class="line"><input id="aCround" placeholder="회차" style="width:60px" inputmode="numeric"><input id="aCrank" placeholder="순위(1~3)" style="width:84px" inputmode="numeric"><input id="aCname" placeholder="이름" style="width:100px"><input id="aCdisc" placeholder="종목(선택)" style="width:100px"><button class="act" id="aCadd">추가</button></div>
        <div id="aClist"></div>
      </div>
      <div class="grp">
        <label>💬 방명록 관리 (삭제)</label>
        <div id="aMlist"></div>
      </div>
      <p class="hint">점수는 아래 스코어보드의 +/- 버튼으로 실시간 조정됩니다.</p>
    </div>

    <!-- 대문 포스터 -->
    <div class="hero"><img id="heroImg" src="poster.png" alt="제2회 호구컵 포스터" /></div>

    <!-- 카운트다운 -->
    <div class="countdown">
      <div class="label" id="cdLabel">제 2회 호구컵까지 남은 시간</div>
      <div class="date" id="cdDate">호구컵 날짜 미정</div>
      <div class="clock">
        <div class="unit"><div class="num" id="dd">00</div><div class="cap">DAYS</div></div>
        <div class="unit"><div class="num" id="hh">00</div><div class="cap">HOURS</div></div>
        <div class="unit"><div class="num" id="mm">00</div><div class="cap">MIN</div></div>
        <div class="unit"><div class="num" id="ss">00</div><div class="cap">SEC</div></div>
      </div>
    </div>
    </div></section>

    <!-- ===== 2화면: 전대회 우승자 + 스코어/명단 보드 ===== -->
    <section class="screen"><div class="screen-inner">
      <h2 class="sec" id="boardTitle">🔥 실시간 스코어보드</h2>
      <div id="defenderBox"></div>
      <div class="score" id="scoreBox"></div>
    </div></section>

    <!-- ===== 3화면: 회차별 우승자 ===== -->
    <section class="screen"><div class="screen-inner">
      <h2 class="sec">🏆 회차별 우승자</h2>
      <div id="champsBox"></div>
    </div></section>

    <!-- ===== 4화면: 방명록(댓글) ===== -->
    <section class="screen"><div class="screen-inner">
      <h2 class="sec">💬 방명록</h2>
      <div class="cmt-form">
        <input id="cmtName" placeholder="이름" maxlength="12">
        <textarea id="cmtText" placeholder="한마디 남겨주세요 ✍️" maxlength="200" rows="2"></textarea>
        <button class="act" id="cmtSend">등록</button>
      </div>
      <div id="cmtList"></div>
      <div class="cmt-pager" id="cmtPager"></div>
      <p class="foot">호구컵</p>
    </div></section>

  </div>

  <!-- 좌우 화면 전환 -->
  <button class="nav prev" id="navPrev" aria-label="이전 화면">‹</button>
  <button class="nav next" id="navNext" aria-label="다음 화면">›</button>
  <div class="dots" id="dots"></div>

  <script type="module">
  // ===================================================================
  // ① Firebase 설정 — 아래 null을 본인 Firebase 설정 객체로 교체하면
  //    '실시간 공유 저장'이 켜집니다. (설정 전엔 로컬 모드로 동작)
  //    설정 방법은 저장소의 SETUP-FIREBASE.md 참고.
  // ===================================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCESyF2c5HKfSxUqmHmjwBLV5vpw7NNJgw",
    authDomain: "hogucup.firebaseapp.com",
    projectId: "hogucup",
    storageBucket: "hogucup.firebasestorage.app",
    messagingSenderId: "351035316017",
    appId: "1:351035316017:web:cd1a069cd7780509ae0210",
    measurementId: "G-KJG5MX8283"
  };
  /* 예시:
  const FIREBASE_CONFIG = {
    apiKey: "AIza....",
    authDomain: "hogu-cup.firebaseapp.com",
    projectId: "hogu-cup",
    storageBucket: "hogu-cup.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef"
  };
  */
  const ADMIN_PASS = "hogu";   // 관리자 비밀번호 (원하는 값으로 변경)

  // 기본 데이터 (Firebase 없을 때 / 최초 시드용)
  const DEFAULT = {
    edition: 2,
    eventDate: null,
    poster: null,
    tracks: [
      { title: "Fantastic Thinking (루디브리엄)", src: "assets/music/fantastic-thinking.mp3" },
      { title: "Blue World", src: "assets/music/blue-world.mp3" },
      { title: "Down Town", src: "assets/music/down-town.mp3" },
      { title: "Beachway", src: "assets/music/beachway.mp3" }
    ],
    comments: [],
    participants: [
      { name:"SANGYUN", no:7 }, { name:"SEOKJUN", no:10 }, { name:"JAEWOOK", no:11 },
      { name:"MUNSEUNG", no:9 }, { name:"WONHYUN", no:8 }, { name:"MINGU", no:6 }
    ],
    champions: [],
    scores: {}   // { 이름: 점수 }
  };

  let state = JSON.parse(JSON.stringify(DEFAULT));
  let isAdmin = false;
  let fb = null;   // { ref, save }

  // ---------- Firebase (옵션) ----------
  async function initFirebase(){
    if (!FIREBASE_CONFIG) return false;
    const [{ initializeApp }, fs] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app = initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const ref = fs.doc(db, 'hogucup', 'state');
    // 문서 없으면 기본값으로 시드
    const snap = await fs.getDoc(ref);
    if (!snap.exists()) await fs.setDoc(ref, DEFAULT);
    // 실시간 구독
    fs.onSnapshot(ref, (d) => {
      if (d.exists()) { state = { ...DEFAULT, ...d.data() }; renderAll(); }
    });
    fb = { ref, save: (s) => fs.setDoc(ref, s) };
    document.getElementById('mode').textContent = '실시간 공유 ON';
    document.getElementById('mode').classList.add('live');
    return true;
  }

  async function save(){
    if (fb) { try { await fb.save(state); } catch(e){ alert('저장 실패: '+e.message); } }
    else { renderAll(); alert('로컬 모드입니다. Firebase 설정 후 전원에게 저장·공유됩니다.'); }
  }

  // ---------- 렌더 ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');

  function renderClock(){
    if (!state.eventDate) {
      $('cdDate').textContent = '호구컵 날짜 미정';
      $('dd').textContent='00'; $('hh').textContent='00'; $('mm').textContent='00'; $('ss').textContent='00';
      return;
    }
    const d = new Date(state.eventDate);
    $('cdDate').textContent = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    let diff = Math.floor((d.getTime() - Date.now())/1000);
    if (diff <= 0) { $('dd').textContent='00'; $('hh').textContent='00'; $('mm').textContent='00'; $('ss').textContent='00'; return; }
    const days=Math.floor(diff/86400); diff-=days*86400;
    const hrs=Math.floor(diff/3600); diff-=hrs*3600;
    const min=Math.floor(diff/60); const sec=diff-min*60;
    $('dd').textContent=pad(days); $('hh').textContent=pad(hrs); $('mm').textContent=pad(min); $('ss').textContent=pad(sec);
  }

  // 지난 대회(= 현재 회차-1) 포디움(1·2·3등) 추출. rank 없으면 1등으로 간주(하위호환).
  function prevPodium(){
    const prevRound = Number(state.edition) - 1;
    const list = (state.champions||[]).filter(c => Number(c.round) === prevRound)
      .map(c => ({ rank: Number(c.rank||1), name: c.name, discipline: c.discipline||'' }))
      .sort((a,b)=> a.rank-b.rank);
    return { prevRound, list, champ: list.find(x=>x.rank===1) || null };
  }

  // 참가자 이름 → 프로필 사진 (없으면 기본 이미지)
  function photoOf(name){
    const p = state.participants.find(x => x.name === name);
    return (p && p.photo) ? p.photo : 'assets/avatar-default.png';
  }

  // 지난 대회 수상자 시상대(2-1-3) — 프로필+이름, 1등은 더 크게
  function renderDefender(){
    const { prevRound, list } = prevPodium();
    if (!list.length) {
      $('defenderBox').innerHTML = `
        <div class="champcard tbd">
          <div class="crown">👑</div>
          <div class="clabel">지난 대회 (제 ${prevRound}회) 수상자들</div>
          <div class="cname">미정</div>
        </div>`;
      return;
    }
    const by = r => list.find(x => x.rank === r);
    const slot = (c, r) => {
      if (!c) return `<div class="wp r${r} empty"></div>`;
      return `<div class="wp r${r}">
        ${r===1 ? '<div class="wcrown">👑</div>' : ''}
        <img class="avatar" src="${photoOf(c.name)}" alt="${c.name}">
        <div class="wname">${c.name}</div>
        ${c.discipline ? `<div class="wdisc">${c.discipline}</div>` : ''}
        <div class="ped"><span class="rnum ${r===1?'ng':r===2?'ns':'nb'}">${r}</span></div>
      </div>`;
    };
    $('defenderBox').innerHTML = `
      <div class="dlabel">🏆 제 ${prevRound}회 호구컵 수상자들</div>
      <div class="wpodium">${slot(by(2),2)}${slot(by(1),1)}${slot(by(3),3)}</div>`;
  }

  // 점수 내림차순 정렬된 참가자 목록
  function sortedScores(){
    return state.participants.map(p => ({ name:p.name, no:p.no, score: Number(state.scores?.[p.name]||0) }))
      .sort((a,b)=> b.score-a.score);
  }
  function ctlHtml(name){
    return isAdmin ? `<div class="ctl"><button data-dn="${name}">−</button><button data-up="${name}">＋</button></div>` : '';
  }
  function bindBump(container){
    if (!isAdmin) return;
    container.querySelectorAll('[data-up]').forEach(b=> b.onclick=()=>{ bump(b.dataset.up, 1); });
    container.querySelectorAll('[data-dn]').forEach(b=> b.onclick=()=>{ bump(b.dataset.dn, -1); });
  }

  let lastBumped = null;   // 방금 점수가 바뀐 참가자(팝 애니메이션용)
  // 스코어보드 — 전체 순위 리스트(1·2·3등 금·은·동 메달)
  // 대회 날짜 이전(또는 미정)이면 true → 참가자 명단 모드 / 지나면 스코어 모드
  function isBeforeEvent(){
    if (!state.eventDate) return true;
    return Date.now() < new Date(state.eventDate).getTime();
  }

  function renderScore(){
    const champ = prevPodium().champ; const champName = champ ? champ.name : null;
    const before = isBeforeEvent();
    $('boardTitle').innerHTML = before ? '👥 참가자 명단' : '🔥 실시간 스코어보드';

    if (before) {
      // 명단 모드: 순위·점수·조작 없이 이름만, 직전 우승자 맨 위 + 왕관
      const champFirst = [], others = [];
      state.participants.forEach(p => { (champName && p.name === champName ? champFirst : others).push(p); });
      const ordered = champFirst.concat(others);
      $('scoreBox').innerHTML = ordered.map(p => {
        const isChamp = champName && p.name === champName;
        return `<div class="row name-only ${isChamp?'champ':''}">
          <div class="nm">${p.name} <small>#${p.no}</small>${isChamp?' <span class="crown">👑</span>':''}</div>
        </div>`;
      }).join('') || '<div class="empty">참가자가 없습니다.</div>';
      lastBumped = null;
      return;
    }

    // 스코어 모드: 순위(금·은·동 메달) + 점수 + 관리자 조작
    const list = sortedScores();
    $('scoreBox').innerHTML = list.map((p,i)=>{
      const rankCell = i < 3
        ? `<div class="medal ${i===0?'g':i===1?'s':'b'}">${i+1}</div>`
        : `<div class="rk">${i+1}</div>`;
      const isChamp = champName && p.name === champName;
      const pop = p.name === lastBumped ? ' pop' : '';
      return `<div class="row ${isChamp?'champ':''}">
        ${rankCell}
        <div class="nm">${p.name} <small>#${p.no}</small>${isChamp?' <span class="crown">👑</span>':''}</div>
        <div class="pt${pop}">${p.score}</div>
        ${ctlHtml(p.name)}
      </div>`;
    }).join('') || '<div class="empty">참가자가 없습니다.</div>';
    lastBumped = null;
    bindBump($('scoreBox'));
  }
  function bump(name, delta){
    state.scores = state.scores || {};
    state.scores[name] = Math.max(0, Number(state.scores[name]||0) + delta);
    lastBumped = name; renderScore(); save();
  }

  // (참가자 명단은 2화면 보드의 '명단 모드'로 통합됨)

  function renderChamps(){
    const winners = (state.champions||[]).filter(c => Number(c.rank||1) === 1);
    if (!winners.length) {
      $('champsBox').innerHTML = `<div class="empty">아직 기록된 우승자가 없습니다. 🏅<br>첫 우승자가 가려지면 이곳에 역대 기록이 쌓입니다.</div>`;
      return;
    }
    const rows = winners.slice().sort((a,b)=>b.round-a.round).map(c =>
      `<tr><td>제 ${c.round}회</td><td class="trophy">🏆 ${c.name}</td><td>${c.discipline||''}</td></tr>`).join('');
    $('champsBox').innerHTML = `<table class="champs"><thead><tr><th>회차</th><th>우승자</th><th>종목</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function renderAdmin(){
    $('cdLabel').textContent = `제 ${state.edition}회 호구컵까지 남은 시간`;
    if (!isAdmin) return;
    // 참가자 목록(사진 교체/삭제)
    $('aPlist').innerHTML = state.participants.map((p,i)=>
      `<div class="line"><img class="mini" src="${p.photo || 'assets/avatar-default.png'}" alt=""><span style="flex:1">#${p.no} ${p.name}</span><button class="rm" data-ph="${i}">📷</button><button class="rm" data-rp="${i}">삭제</button></div>`).join('');
    $('aPlist').querySelectorAll('[data-rp]').forEach(b=> b.onclick=()=>{ state.participants.splice(+b.dataset.rp,1); renderAll(); save(); });
    $('aPlist').querySelectorAll('[data-ph]').forEach(b=> b.onclick=()=>{ photoSwapIdx = +b.dataset.ph; $('aPphotoSwap').click(); });
    // 우승자 목록(삭제)
    $('aClist').innerHTML = state.champions.slice()
      .map((c,i)=>({c,i})).sort((a,b)=> (b.c.round-a.c.round)||(Number(a.c.rank||1)-Number(b.c.rank||1)))
      .map(({c,i})=>{
        const rk = Number(c.rank||1); const medal = rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':`${rk}등`;
        return `<div class="line"><span style="flex:1">제${c.round}회 · ${medal} ${c.name} ${c.discipline?('· '+c.discipline):''}</span><button class="rm" data-rc="${i}">삭제</button></div>`;
      }).join('');
    $('aClist').querySelectorAll('[data-rc]').forEach(b=> b.onclick=()=>{ state.champions.splice(+b.dataset.rc,1); renderAll(); save(); });
    // 방명록 관리(삭제)
    const cl = (state.comments || []);
    $('aMlist').innerHTML = cl.map((c,i)=>
      `<div class="line"><span style="flex:1">💬 <b>${esc(c.name)}</b> · ${esc(c.text.length>30 ? c.text.slice(0,30)+'…' : c.text)}</span><button class="rm" data-dm="${i}">삭제</button></div>`).join('')
      || '<p class="hint">등록된 방명록이 없습니다.</p>';
    $('aMlist').querySelectorAll('[data-dm]').forEach(b=> b.onclick=()=>{
      state.comments = (state.comments||[]).slice(); state.comments.splice(+b.dataset.dm,1);
      renderComments(); renderAdmin(); save();
    });
    // 주크박스 재생목록(삭제)
    const tl = (state.tracks || DEFAULT.tracks);
    $('aTlist').innerHTML = tl.map((t,i)=>
      `<div class="line"><span style="flex:1">🎵 ${t.title}</span><button class="rm" data-rt="${i}">삭제</button></div>`).join('')
      || '<p class="hint">재생목록이 비어 있습니다.</p>';
    $('aTlist').querySelectorAll('[data-rt]').forEach(b=> b.onclick=()=>{
      state.tracks = (state.tracks || DEFAULT.tracks).slice();
      state.tracks.splice(+b.dataset.rt, 1);
      renderJukebox(); renderAdmin(); save();
    });
  }

  // 대문 이미지 (업로드본 있으면 그걸로, 없으면 기본 포스터)
  function renderHero(){ $('heroImg').src = state.poster || 'poster.png'; }

  // ---------- 방명록(댓글) ----------
  function timeAgo(ts){
    const s = Math.floor((Date.now() - ts)/1000);
    if (s < 60) return '방금';
    if (s < 3600) return Math.floor(s/60) + '분 전';
    if (s < 86400) return Math.floor(s/3600) + '시간 전';
    const d = new Date(ts);
    return `${d.getMonth()+1}.${d.getDate()}`;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const CMT_PER_PAGE = 6;   // 방명록 한 페이지 표시 수
  let cmtPage = 0;
  function renderComments(){
    const list = (state.comments || []);
    if (!list.length) { $('cmtList').innerHTML = `<div class="cmt-empty">아직 글이 없어요. 첫 한마디를 남겨보세요! 💬</div>`; $('cmtPager').innerHTML=''; return; }
    const pages = Math.ceil(list.length / CMT_PER_PAGE);
    cmtPage = Math.max(0, Math.min(cmtPage, pages - 1));
    const slice = list.slice(cmtPage*CMT_PER_PAGE, (cmtPage+1)*CMT_PER_PAGE);
    $('cmtList').innerHTML = slice.map(c=>`
      <div class="cmt">
        <div class="top"><span class="who">${esc(c.name)}</span><span class="when">${timeAgo(c.ts)}</span></div>
        <div class="body">${esc(c.text)}</div>
      </div>`).join('');
    // 페이저: 2페이지 이상일 때만 표시
    $('cmtPager').innerHTML = pages > 1 ? `
      <button class="pgbtn" id="cmtPgPrev" ${cmtPage<=0?'disabled':''}>◀</button>
      <span class="pginfo">${cmtPage+1} / ${pages}</span>
      <button class="pgbtn" id="cmtPgNext" ${cmtPage>=pages-1?'disabled':''}>▶</button>` : '';
    if (pages > 1) {
      $('cmtPgPrev').onclick = ()=>{ cmtPage--; renderComments(); };
      $('cmtPgNext').onclick = ()=>{ cmtPage++; renderComments(); };
    }
  }
  $('cmtSend').onclick = ()=>{
    const name = $('cmtName').value.trim(); const text = $('cmtText').value.trim();
    if (!name || !text) { alert('이름과 내용을 입력하세요.'); return; }
    localStorage.setItem('hogucup_nick', name);
    state.comments = (state.comments || []).slice();
    state.comments.unshift({ name, text, ts: Date.now() });
    if (state.comments.length > 200) state.comments.length = 200;   // 과도 누적 방지
    $('cmtText').value='';
    cmtPage = 0;   // 등록한 글이 보이도록 첫 페이지로
    renderComments(); save();
  };

  function renderAll(){ renderHero(); renderClock(); renderDefender(); renderScore(); renderChamps(); renderAdmin(); renderJukebox(); renderComments(); }

  // ---------- 관리자 토글 ----------
  $('adminToggle').onclick = ()=>{
    if (isAdmin) { isAdmin=false; $('admin').classList.remove('on'); $('adminToggle').textContent='관리자'; renderAll(); return; }
    const pw = prompt('관리자 비밀번호');
    if (pw === ADMIN_PASS) { isAdmin=true; $('admin').classList.add('on'); $('adminToggle').textContent='관리자 종료'; renderAll(); }
    else if (pw!==null) alert('비밀번호가 틀렸습니다.');
  };
  $('aDateSave').onclick = ()=>{ const v=$('aDate').value; state.eventDate = v? v : null; renderAll(); save(); };
  // 프로필 사진 정사각 리사이즈(중앙 크롭 → JPEG dataURL)
  function resizePhoto(file, size, cb){
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
        const s = Math.min(img.width, img.height);
        cv.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
        cb(cv.toDataURL('image/jpeg', .78));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  $('aPadd').onclick = ()=>{
    const n=$('aPname').value.trim(); const no=$('aPno').value.trim(); if(!n) return;
    const f = $('aPphoto').files && $('aPphoto').files[0];
    const done = (photo)=>{
      const entry = { name:n, no:no||'-' }; if (photo) entry.photo = photo;
      state.participants.push(entry);
      $('aPname').value=''; $('aPno').value=''; $('aPphoto').value='';
      renderAll(); save();
    };
    if (f) resizePhoto(f, 96, done); else done(null);
  };
  // 기존 참가자 사진 교체(📷)
  let photoSwapIdx = -1;
  $('aPphotoSwap').onchange = ()=>{
    const f = $('aPphotoSwap').files && $('aPphotoSwap').files[0];
    if (!f || photoSwapIdx < 0) return;
    resizePhoto(f, 96, (photo)=>{
      state.participants[photoSwapIdx].photo = photo;
      photoSwapIdx = -1; $('aPphotoSwap').value='';
      renderAll(); save();
    });
  };
  $('aCadd').onclick = ()=>{ const r=$('aCround').value.trim(); const n=$('aCname').value.trim(); if(!r||!n) return; const rk=parseInt($('aCrank').value.trim(),10); state.champions.push({round:+r,rank:(rk>=1&&rk<=3)?rk:1,name:n,discipline:$('aCdisc').value.trim()}); $('aCround').value=''; $('aCrank').value=''; $('aCname').value=''; $('aCdisc').value=''; renderAll(); save(); };

  // 대문 이미지 업로드 — canvas로 축소(가로 최대 1100px, JPEG 0.82) 후 dataURL 저장
  $('aPoster').onchange = (e)=>{
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1100; const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL('image/jpeg', 0.82);
        if (dataUrl.length > 950000) { alert('이미지가 너무 큽니다. 더 작은 이미지를 사용해 주세요.'); return; }
        state.poster = dataUrl; $('aPoster').value=''; renderAll(); save();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  $('aPosterReset').onclick = ()=>{ state.poster = null; renderAll(); save(); };

  // ---------- 주크박스 ----------
  const bgm = $('bgm'); const bgmBtn = $('bgmBtn');
  bgm.volume = 0.45;
  let trackIdx = 0;          // 현재 곡 인덱스
  let muted = false;         // 음소거
  let wantPlay = true;       // 재생 의도(자동재생 차단 대비)
  let sessionTracks = [];    // 큰 파일 업로드 → 이 기기에서만 임시 재생(공유X)

  function playlist(){
    const shared = (state.tracks && state.tracks.length) ? state.tracks : [];
    return shared.concat(sessionTracks);
  }
  function renderJukebox(){
    const list = playlist();
    if (trackIdx >= list.length) trackIdx = 0;
    const cur = list[trackIdx];
    $('jbTitle').textContent = cur ? cur.title : '재생할 곡이 없습니다';
    const playing = wantPlay && !bgm.paused && !muted;
    $('jbPlay').textContent = playing ? '⏸' : '▶';
    $('jukebox').classList.toggle('playing', playing);
    bgmBtn.textContent = muted ? '🔇' : '🔊';
  }
  function loadTrack(i, autoplay){
    const list = playlist(); if (!list.length) { renderJukebox(); return; }
    trackIdx = (i + list.length) % list.length;
    bgm.src = list[trackIdx].src;
    if (autoplay) tryPlay(); else renderJukebox();
  }
  async function tryPlay(){
    if (muted) { renderJukebox(); return; }
    try { await bgm.play(); } catch(e) {}
    renderJukebox();
  }
  // 곡 종료 → 다음 곡 자동
  bgm.addEventListener('ended', () => loadTrack(trackIdx + 1, true));
  // 컨트롤
  $('jbPrev').onclick = (e)=>{ e.stopPropagation(); wantPlay = true; loadTrack(trackIdx - 1, true); };
  $('jbNext').onclick = (e)=>{ e.stopPropagation(); wantPlay = true; loadTrack(trackIdx + 1, true); };
  $('jbPlay').onclick = (e)=>{ e.stopPropagation();
    if (bgm.paused) { wantPlay = true; muted = false; tryPlay(); }
    else { wantPlay = false; bgm.pause(); renderJukebox(); }
  };
  bgmBtn.onclick = (e)=>{ e.stopPropagation();
    muted = !muted; bgm.muted = muted;
    if (!muted && bgm.paused && wantPlay) tryPlay(); else renderJukebox();
  };
  // 자동재생 차단 대비: 첫 상호작용 때 재생
  function kick(){ if (wantPlay && !muted) tryPlay(); window.removeEventListener('pointerdown', kick); window.removeEventListener('keydown', kick); }
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);

  // ---------- 관리자: 주크박스 재생목록 ----------
  $('aTadd').onclick = ()=>{
    const t = $('aTtitle').value.trim(); const u = $('aTurl').value.trim();
    if (!t || !u) { alert('곡 제목과 URL을 입력하세요.'); return; }
    state.tracks = (state.tracks || DEFAULT.tracks).slice();
    state.tracks.push({ title: t, src: u });
    $('aTtitle').value=''; $('aTurl').value='';
    renderJukebox(); renderAdmin(); save();
  };
  $('aTupload').onclick = ()=>{
    const file = $('aTfile').files && $('aTfile').files[0];
    if (!file) { alert('오디오 파일을 선택하세요.'); return; }
    const title = $('aTtitle').value.trim() || file.name.replace(/\.[^.]+$/, '');
    if (file.size <= 700*1024) {
      // 작은 파일 → dataURL로 전원 공유 저장
      const reader = new FileReader();
      reader.onload = ()=>{
        state.tracks = (state.tracks || DEFAULT.tracks).slice();
        state.tracks.push({ title, src: reader.result });
        $('aTtitle').value=''; $('aTfile').value='';
        renderJukebox(); renderAdmin(); save();
      };
      reader.readAsDataURL(file);
    } else {
      // 큰 파일 → 이 기기에서만 임시 재생
      const url = URL.createObjectURL(file);
      sessionTracks.push({ title: title + ' (이 기기 임시)', src: url });
      $('aTtitle').value=''; $('aTfile').value='';
      alert('파일이 커서 이 기기에서만 임시 재생됩니다(새로고침 시 사라짐). 전원 공유하려면 작은 파일이나 URL을 사용하세요.');
      renderJukebox(); renderAdmin();
    }
  };

  // ---------- 화면 캐러셀 네비게이션 ----------
  const screensEl = $('screens'); const dotsEl = $('dots'); const SCREEN_COUNT = 4;
  function currentScreen(){ return Math.round(screensEl.scrollLeft / screensEl.clientWidth); }
  function goTo(i){ i = Math.max(0, Math.min(SCREEN_COUNT-1, i)); screensEl.scrollTo({ left: i*screensEl.clientWidth, behavior: 'smooth' }); }
  dotsEl.innerHTML = Array.from({length:SCREEN_COUNT}, (_,i)=>`<div class="dot" data-i="${i}"></div>`).join('');
  dotsEl.querySelectorAll('.dot').forEach(d=> d.onclick=()=> goTo(+d.dataset.i));
  function updateNav(){
    const i = currentScreen();
    $('navPrev').disabled = i <= 0;
    $('navNext').disabled = i >= SCREEN_COUNT-1;
    dotsEl.querySelectorAll('.dot').forEach((d,idx)=> d.classList.toggle('on', idx===i));
  }
  $('navPrev').onclick = ()=> goTo(currentScreen()-1);
  $('navNext').onclick = ()=> goTo(currentScreen()+1);
  screensEl.addEventListener('scroll', ()=> requestAnimationFrame(updateNav), { passive:true });
  window.addEventListener('keydown', (e)=>{ if(e.key==='ArrowLeft') goTo(currentScreen()-1); else if(e.key==='ArrowRight') goTo(currentScreen()+1); });
  window.addEventListener('resize', ()=>{ goTo(currentScreen()); updateNav(); });
  updateNav();

  // ---------- 시작 ----------
  const savedNick = localStorage.getItem('hogucup_nick'); if (savedNick) $('cmtName').value = savedNick;
  renderAll();
  loadTrack(0, true);   // 첫 곡 로드 + 자동재생 시도(차단 시 첫 상호작용/▶로 재생)
  let lastBefore = isBeforeEvent();
  setInterval(()=>{
    renderClock();
    const b = isBeforeEvent();
    if (b !== lastBefore) { lastBefore = b; renderScore(); }   // 대회 시작 시각을 넘기면 명단→스코어 자동 전환
  }, 1000);
  initFirebase().catch(e => console.warn('Firebase 미설정/오류 → 로컬 모드', e));
  </script>
</body>
</html>
