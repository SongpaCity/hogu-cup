<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>호구컵</title>
  <meta property="og:title" content="호구컵" />
  <meta property="og:description" content="제2회 호구컵 — THE ROAD TO THE THRONE" />
  <meta property="og:image" content="poster.png" />
  <style>
    :root { --bg:#0a0d14; --card:#141922; --text:#e9edf4; --muted:#93a0b4; --gold:#f4c430; --gold2:#caa22a; --border:#232b38; --up:#ef4444; --ok:#3ddc84; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(1000px 500px at 50% -5%, #141b2b, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 56px; }

    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 10px 0 0; }
    .mode { font-size: .7rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }
    .mode.live { color: var(--ok); border-color: #1f3a2b; }
    .adminbtn { font-size: .72rem; color: var(--gold); background: none; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; cursor: pointer; }

    .hero { margin: 10px 0 0; }
    .hero img { width: 100%; height: auto; display: block; border-radius: 18px; border: 1px solid var(--border); box-shadow: 0 12px 40px rgba(0,0,0,.5); }

    .countdown { margin: 22px 0 0; background: linear-gradient(180deg, #19202c, #11161f); border: 1px solid var(--border); border-radius: 16px; padding: 20px 18px; text-align: center; }
    .countdown .label { color: var(--gold); font-weight: 700; letter-spacing: .02em; font-size: .98rem; }
    .countdown .date { color: var(--muted); font-size: .82rem; margin-top: 4px; }
    .clock { margin-top: 12px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .unit { background: #0a0d14; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; min-width: 74px; }
    .unit .num { font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; line-height: 1.1; }
    .unit .cap { font-size: .68rem; color: var(--muted); margin-top: 2px; letter-spacing: .08em; }

    h2.sec { font-size: 1.15rem; margin: 30px 0 12px; padding-left: 10px; border-left: 4px solid var(--gold); }

    /* 스코어보드 */
    .score { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .score .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .score .row:last-child { border-bottom: 0; }
    .score .rk { width: 26px; text-align: center; font-weight: 800; color: var(--muted); }
    .score .rk.top { color: var(--gold); }
    .score .nm { flex: 1; font-weight: 700; }
    .score .nm small { color: var(--muted); font-weight: 400; margin-left: 6px; }
    .score .pt { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
    .score .ctl { display: flex; gap: 6px; margin-left: 10px; }
    .score .ctl button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #0a0d14; color: var(--text); font-weight: 700; cursor: pointer; }

    .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .player { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; }
    .player .no { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: linear-gradient(145deg, var(--gold), var(--gold2)); color: #1a1205; }
    .player .nm { font-weight: 700; }

    .champs { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .champs th, .champs td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: .92rem; }
    .champs th { color: var(--muted); font-weight: 600; font-size: .78rem; background: #0f141d; }
    .champs tr:last-child td { border-bottom: 0; }
    .champs .trophy { color: var(--gold); }
    .empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 20px; background: var(--card); border: 1px dashed var(--border); border-radius: 14px; }

    /* 관리자 패널 */
    #admin { display: none; margin: 14px 0 0; background: #11161f; border: 1px dashed var(--gold2); border-radius: 14px; padding: 16px; }
    #admin.on { display: block; }
    #admin h3 { margin: 0 0 10px; font-size: .95rem; color: var(--gold); }
    #admin .grp { margin: 0 0 14px; }
    #admin label { display: block; font-size: .78rem; color: var(--muted); margin: 0 0 4px; }
    #admin input, #admin button.act { font: inherit; }
    #admin input { background: #0a0d14; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: .9rem; }
    #admin button.act { background: var(--gold); color: #1a1205; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
    #admin button.rm { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: .8rem; }
    #admin .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
    #admin .hint { color: var(--muted); font-size: .76rem; line-height: 1.5; }

    .foot { color: #566072; font-size: .76rem; text-align: center; margin-top: 34px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="mode" id="mode">로컬 모드</span>
      <button class="adminbtn" id="adminToggle">관리자</button>
    </div>

    <!-- 관리자 패널 -->
    <div id="admin">
      <h3>🔧 관리자 패널 <span style="color:var(--muted);font-weight:400;font-size:.8rem">(변경 즉시 전원에게 반영)</span></h3>
      <div class="grp">
        <label>호구컵 날짜 (비우면 '미정')</label>
        <div class="line"><input type="datetime-local" id="aDate"><button class="act" id="aDateSave">저장</button></div>
      </div>
      <div class="grp">
        <label>참가자 추가</label>
        <div class="line"><input id="aPname" placeholder="이름" style="width:120px"><input id="aPno" placeholder="번호" style="width:70px" inputmode="numeric"><button class="act" id="aPadd">추가</button></div>
        <div id="aPlist"></div>
      </div>
      <div class="grp">
        <label>우승자 추가</label>
        <div class="line"><input id="aCround" placeholder="회차" style="width:60px" inputmode="numeric"><input id="aCname" placeholder="우승자" style="width:110px"><input id="aCdisc" placeholder="종목(선택)" style="width:110px"><button class="act" id="aCadd">추가</button></div>
        <div id="aClist"></div>
      </div>
      <p class="hint">점수는 아래 스코어보드의 +/- 버튼으로 실시간 조정됩니다.</p>
    </div>

    <!-- 대문 포스터 -->
    <div class="hero"><img src="poster.png" alt="제2회 호구컵 포스터" /></div>

    <!-- 카운트다운 -->
    <div class="countdown">
      <div class="label" id="cdLabel">제 2회 호구컵까지 남은 시간</div>
      <div class="date" id="cdDate">호구컵 날짜 미정</div>
      <div class="clock">
        <div class="unit"><div class="num" id="dd">00</div><div class="cap">DAYS</div></div>
        <div class="unit"><div class="num" id="hh">00</div><div class="cap">HOURS</div></div>
        <div class="unit"><div class="num" id="mm">00</div><div class="cap">MIN</div></div>
        <div class="unit"><div class="num" id="ss">00</div><div class="cap">SEC</div></div>
      </div>
    </div>

    <!-- 실시간 스코어보드 -->
    <h2 class="sec">🔥 실시간 스코어보드</h2>
    <div class="score" id="scoreBox"></div>

    <!-- 참가자 명단 -->
    <h2 class="sec">👥 참가자 명단</h2>
    <div class="players" id="players"></div>

    <!-- 회차별 우승자 -->
    <h2 class="sec">🏆 회차별 우승자</h2>
    <div id="champsBox"></div>

    <p class="foot">hogu-cup · GitHub Pages</p>
  </div>

  <script type="module">
  // ===================================================================
  // ① Firebase 설정 — 아래 null을 본인 Firebase 설정 객체로 교체하면
  //    '실시간 공유 저장'이 켜집니다. (설정 전엔 로컬 모드로 동작)
  //    설정 방법은 저장소의 SETUP-FIREBASE.md 참고.
  // ===================================================================
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCESyF2c5HKfSxUqmHmjwBLV5vpw7NNJgw",
    authDomain: "hogucup.firebaseapp.com",
    projectId: "hogucup",
    storageBucket: "hogucup.firebasestorage.app",
    messagingSenderId: "351035316017",
    appId: "1:351035316017:web:cd1a069cd7780509ae0210",
    measurementId: "G-KJG5MX8283"
  };
  /* 예시:
  const FIREBASE_CONFIG = {
    apiKey: "AIza....",
    authDomain: "hogu-cup.firebaseapp.com",
    projectId: "hogu-cup",
    storageBucket: "hogu-cup.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef"
  };
  */
  const ADMIN_PASS = "hogu";   // 관리자 비밀번호 (원하는 값으로 변경)

  // 기본 데이터 (Firebase 없을 때 / 최초 시드용)
  const DEFAULT = {
    edition: 2,
    eventDate: null,
    participants: [
      { name:"SANGYUN", no:7 }, { name:"SEOKJUN", no:10 }, { name:"JAEWOOK", no:11 },
      { name:"MUNSEUNG", no:9 }, { name:"WONHYUN", no:8 }, { name:"MINGU", no:6 }
    ],
    champions: [],
    scores: {}   // { 이름: 점수 }
  };

  let state = JSON.parse(JSON.stringify(DEFAULT));
  let isAdmin = false;
  let fb = null;   // { ref, save }

  // ---------- Firebase (옵션) ----------
  async function initFirebase(){
    if (!FIREBASE_CONFIG) return false;
    const [{ initializeApp }, fs] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app = initializeApp(FIREBASE_CONFIG);
    const db = fs.getFirestore(app);
    const ref = fs.doc(db, 'hogucup', 'state');
    // 문서 없으면 기본값으로 시드
    const snap = await fs.getDoc(ref);
    if (!snap.exists()) await fs.setDoc(ref, DEFAULT);
    // 실시간 구독
    fs.onSnapshot(ref, (d) => {
      if (d.exists()) { state = { ...DEFAULT, ...d.data() }; renderAll(); }
    });
    fb = { ref, save: (s) => fs.setDoc(ref, s) };
    document.getElementById('mode').textContent = '실시간 공유 ON';
    document.getElementById('mode').classList.add('live');
    return true;
  }

  async function save(){
    if (fb) { try { await fb.save(state); } catch(e){ alert('저장 실패: '+e.message); } }
    else { renderAll(); alert('로컬 모드입니다. Firebase 설정 후 전원에게 저장·공유됩니다.'); }
  }

  // ---------- 렌더 ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');

  function renderClock(){
    if (!state.eventDate) {
      $('cdDate').textContent = '호구컵 날짜 미정';
      $('dd').textContent='00'; $('hh').textContent='00'; $('mm').textContent='00'; $('ss').textContent='00';
      return;
    }
    const d = new Date(state.eventDate);
    $('cdDate').textContent = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    let diff = Math.floor((d.getTime() - Date.now())/1000);
    if (diff <= 0) { $('dd').textContent='00'; $('hh').textContent='00'; $('mm').textContent='00'; $('ss').textContent='00'; return; }
    const days=Math.floor(diff/86400); diff-=days*86400;
    const hrs=Math.floor(diff/3600); diff-=hrs*3600;
    const min=Math.floor(diff/60); const sec=diff-min*60;
    $('dd').textContent=pad(days); $('hh').textContent=pad(hrs); $('mm').textContent=pad(min); $('ss').textContent=pad(sec);
  }

  function renderScore(){
    const list = state.participants.map(p => ({ name:p.name, no:p.no, score: Number(state.scores?.[p.name]||0) }))
      .sort((a,b)=> b.score-a.score);
    $('scoreBox').innerHTML = list.map((p,i)=>`
      <div class="row">
        <div class="rk ${i===0?'top':''}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)}</div>
        <div class="nm">${p.name} <small>#${p.no}</small></div>
        <div class="pt">${p.score}</div>
        ${isAdmin?`<div class="ctl"><button data-dn="${p.name}">−</button><button data-up="${p.name}">＋</button></div>`:''}
      </div>`).join('') || '<div class="empty">참가자가 없습니다.</div>';
    if (isAdmin) {
      $('scoreBox').querySelectorAll('[data-up]').forEach(b=> b.onclick=()=>{ bump(b.dataset.up, 1); });
      $('scoreBox').querySelectorAll('[data-dn]').forEach(b=> b.onclick=()=>{ bump(b.dataset.dn, -1); });
    }
  }
  function bump(name, delta){
    state.scores = state.scores || {};
    state.scores[name] = Math.max(0, Number(state.scores[name]||0) + delta);
    renderScore(); save();
  }

  function renderPlayers(){
    $('players').innerHTML = state.participants.map(p =>
      `<div class="player"><div class="no">${p.no}</div><div class="nm">${p.name}</div></div>`).join('');
  }

  function renderChamps(){
    if (!state.champions.length) {
      $('champsBox').innerHTML = `<div class="empty">아직 기록된 우승자가 없습니다. 🏅<br>첫 우승자가 가려지면 이곳에 역대 기록이 쌓입니다.</div>`;
      return;
    }
    const rows = state.champions.slice().sort((a,b)=>b.round-a.round).map(c =>
      `<tr><td>제 ${c.round}회</td><td class="trophy">🏆 ${c.name}</td><td>${c.discipline||''}</td></tr>`).join('');
    $('champsBox').innerHTML = `<table class="champs"><thead><tr><th>회차</th><th>우승자</th><th>종목</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function renderAdmin(){
    $('cdLabel').textContent = `제 ${state.edition}회 호구컵까지 남은 시간`;
    if (!isAdmin) return;
    // 참가자 목록(삭제)
    $('aPlist').innerHTML = state.participants.map((p,i)=>
      `<div class="line"><span style="flex:1">#${p.no} ${p.name}</span><button class="rm" data-rp="${i}">삭제</button></div>`).join('');
    $('aPlist').querySelectorAll('[data-rp]').forEach(b=> b.onclick=()=>{ state.participants.splice(+b.dataset.rp,1); renderAll(); save(); });
    // 우승자 목록(삭제)
    $('aClist').innerHTML = state.champions.map((c,i)=>
      `<div class="line"><span style="flex:1">제${c.round}회 · ${c.name} ${c.discipline?('· '+c.discipline):''}</span><button class="rm" data-rc="${i}">삭제</button></div>`).join('');
    $('aClist').querySelectorAll('[data-rc]').forEach(b=> b.onclick=()=>{ state.champions.splice(+b.dataset.rc,1); renderAll(); save(); });
  }

  function renderAll(){ renderClock(); renderScore(); renderPlayers(); renderChamps(); renderAdmin(); }

  // ---------- 관리자 토글 ----------
  $('adminToggle').onclick = ()=>{
    if (isAdmin) { isAdmin=false; $('admin').classList.remove('on'); $('adminToggle').textContent='관리자'; renderAll(); return; }
    const pw = prompt('관리자 비밀번호');
    if (pw === ADMIN_PASS) { isAdmin=true; $('admin').classList.add('on'); $('adminToggle').textContent='관리자 종료'; renderAll(); }
    else if (pw!==null) alert('비밀번호가 틀렸습니다.');
  };
  $('aDateSave').onclick = ()=>{ const v=$('aDate').value; state.eventDate = v? v : null; renderAll(); save(); };
  $('aPadd').onclick = ()=>{ const n=$('aPname').value.trim(); const no=$('aPno').value.trim(); if(!n) return; state.participants.push({name:n,no:no||'-'}); $('aPname').value=''; $('aPno').value=''; renderAll(); save(); };
  $('aCadd').onclick = ()=>{ const r=$('aCround').value.trim(); const n=$('aCname').value.trim(); if(!r||!n) return; state.champions.push({round:+r,name:n,discipline:$('aCdisc').value.trim()}); $('aCround').value=''; $('aCname').value=''; $('aCdisc').value=''; renderAll(); save(); };

  // ---------- 시작 ----------
  renderAll();
  setInterval(renderClock, 1000);
  initFirebase().catch(e => console.warn('Firebase 미설정/오류 → 로컬 모드', e));
  </script>
</body>
</html>
